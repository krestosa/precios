<pw-panel class="source-panel" heading="1. Fuente de precios" description="Carga local; la UI no parsea el archivo.">
  <div class="stack">
    <pw-file-dropzone class="source-dropzone" label="Cargar fuente local"></pw-file-dropzone>
    <div class="source-file" aria-live="polite" aria-atomic="true" hidden><strong></strong><div class="message"></div></div>
    <div class="sheet-selector" hidden>
      <label for="source-sheet">Hoja de datos</label>
      <select id="source-sheet" class="sheet-select">
        <option value="" selected disabled>Seleccioná una hoja</option>
      </select>
      <p class="sheet-suggestion" hidden></p>
      <div class="sheet-feedback" aria-live="polite" aria-atomic="true">
        <pw-status-chip class="sheet-status"></pw-status-chip>
        <p class="sheet-message" hidden></p>
        <p class="sheet-summary" hidden></p>
        <p class="sheet-warnings" hidden></p>
      </div>
      <template class="sheet-option-template"><option></option></template>
    </div>
    <div class="resolution-defaults" hidden>
      <strong>Selección de precios del lote</strong>
      <div class="resolution-field local-field" hidden>
        <label for="batch-local">Local de precios</label>
        <select id="batch-local" class="batch-local"><option value="" selected>Seleccioná un local</option></select>
      </div>
      <div class="resolution-field channel-field" hidden>
        <label for="batch-channel">Canal</label>
        <select id="batch-channel" class="batch-channel"><option value="" selected>Seleccioná un canal</option></select>
      </div>
      <p class="resolution-next" aria-live="polite" aria-atomic="true"></p>
      <template class="resolution-option-template"><option></option></template>
    </div>
  </div>
</pw-panel>
<pw-panel heading="2. Archivos SVG" description="Admite múltiples archivos y conserva errores de forma aislada.">
  <div class="stack">
    <pw-file-dropzone class="svg-dropzone" accept=".svg,image/svg+xml" multiple label="Cargar SVG" helper="Seleccioná uno o varios archivos SVG"></pw-file-dropzone>
    <div class="queue-feedback" aria-live="polite" aria-relevant="additions text">
      <pw-empty-state class="queue-empty" heading="Cola vacía" message="Los SVG aparecerán acá cuando el adaptador entregue sus view-models."></pw-empty-state>
      <pw-data-list class="queue" hidden></pw-data-list>
    </div>
  </div>
</pw-panel>
