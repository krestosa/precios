<div class="app app-shell">
  <nav class="rail" aria-label="Navegación principal" data-variant="collapsed">
    <div class="rail-destinations">
      <button class="rail-destination selected" type="button" data-destination="source" aria-current="page">
        <span class="rail-indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4-4 4M5 14v5h14v-5"/></svg></span><span class="rail-label">Carga</span>
      </button>
      <button class="rail-destination" type="button" data-destination="results">
        <span class="rail-indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m6 16 4-4 3 3 2-2 3 3"/></svg></span><span class="rail-label">Resultados</span>
      </button>
      <button class="rail-destination" type="button" data-destination="review">
        <span class="rail-indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg></span><span class="rail-label">Revisión</span>
      </button>
      <button class="rail-destination" type="button" data-destination="validation">
        <span class="rail-indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span><span class="rail-label">Validación</span>
      </button>
      <button class="rail-destination" type="button" data-destination="export">
        <span class="rail-indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg></span><span class="rail-label">Exportar</span>
      </button>
    </div>
  </nav>

  <main class="dashboard workspace">
    <header class="topbar">
      <button class="inspector-toggle" type="button" aria-expanded="false" aria-controls="dashboard-inspector">Inspector</button>
      <div class="top-actions"><pw-status-chip tone="info" label="Procesamiento local"></pw-status-chip><pw-progress class="progress" hidden></pw-progress></div>
    </header>

    <div class="dashboard-layout">
      <section id="results-section" class="canvas-region dashboard-primary" aria-label="Resultado procesado seleccionado">
        <pw-processed-canvas-template></pw-processed-canvas-template>
      </section>

      <aside id="dashboard-inspector" class="inspector" aria-label="Inspector del output seleccionado">
        <section class="inspector-section output-selector-section"><pw-results-gallery-template compact></pw-results-gallery-template></section>
        <section id="source-section" class="inspector-section"><pw-source-queue-template></pw-source-queue-template><pw-fonts-template></pw-fonts-template></section>
        <section id="review-section" class="inspector-section"><pw-review-template></pw-review-template></section>
        <section id="validation-section" class="inspector-section"><pw-preflight-template></pw-preflight-template></section>
        <section id="export-section" class="inspector-section"><pw-export-template></pw-export-template></section>
      </aside>
    </div>
  </main>
</div>
