name: Build and publish static site

on:
  push:
    branches:
      - main
      - integration/preview-runtime
      - fix/deep-runtime-stabilization
  workflow_dispatch:

concurrency:
  group: static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Assemble portable handoff
        run: node scripts/assemble-handoff.mjs --output handoff-output

      - name: Run common portable pipeline
        env:
          BUILD_INPUT_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp || '' }}
        run: sh ./handoff-output/install-build.sh

      - name: Install focal QA dependencies
        run: npm ci

      - name: Run W27 focal regressions
        run: |
          ./node_modules/.bin/vitest run \
            tests/runtime/deep-runtime-stabilization.e2e.test.ts \
            tests/runtime/font-resolver-dispose-race.test.ts \
            tests/runtime/post-center-canvas-stabilization.e2e.test.ts \
            tests/runtime/generic-artwork-scopes.e2e.test.ts \
            tests/runtime/generic-all-incomplete-targets.e2e.test.ts \
            tests/runtime/workbook-multisheet.ui-runtime.test.ts \
            tests/runtime/results-gallery-ui.test.ts \
            tests/runtime/product-hardcode-audit.test.ts

      - name: Upload exact dist artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: handoff-output/dist
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload portable handoff artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: handoff-os-agnostic
          path: handoff-output
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload QA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: metadata-qa
          path: |
            handoff-output/qa
            handoff-output/package-lock.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload static hosting artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: handoff-output/dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/preview-runtime'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout smoke runner
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Probe deployed page and assets
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          node scripts/portable-pipeline.mjs --smoke-url "${DEPLOYED_URL}" 2>&1 | tee deployment-smoke.log

      - name: Run W6 Pages HTTP smoke
        env:
          PRECIOS_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          node tests/pages/pages-http-smoke.mjs 2>&1 | tee pages-http-smoke.log

      - name: Upload deployment smoke artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-smoke
          path: |
            deployment-smoke.log
            pages-http-smoke.log
          if-no-files-found: error