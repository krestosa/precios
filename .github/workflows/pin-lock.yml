name: Pin generated lock

on:
  push:
    branches:
      - integration/preview-runtime
    paths:
      - .github/workflows/pin-lock.yml

permissions:
  actions: read
  contents: write

jobs:
  pin-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7.0.1
        with:
          ref: integration/preview-runtime

      - name: Recover validated lock artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9679561739/zip" \
            --output /tmp/metadata-qa.zip
          mkdir -p /tmp/metadata-qa
          unzip -q /tmp/metadata-qa.zip -d /tmp/metadata-qa
          printf '%s  %s\n' \
            'a283e77f43c875cc12079874052adba20cc6db0e10779f3661bf17db1a8e2c20' \
            '/tmp/metadata-qa/package-lock.json' \
            | sha256sum --check --strict
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/metadata-qa/package-lock.json','utf8'));if(p.lockfileVersion!==3||Object.keys(p.packages||{}).length!==134)process.exit(1);const x=p.packages?.['node_modules/xlsx'];if(x?.version!=='0.20.3'||typeof x.resolved!=='string'||typeof x.integrity!=='string')process.exit(1)"
          cp /tmp/metadata-qa/package-lock.json package-lock.json

      - name: Commit exact lock bytes
        run: |
          set -eu
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 'a283e77f43c875cc12079874052adba20cc6db0e10779f3661bf17db1a8e2c20'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git commit -m 'build: lock frontend dependencies'
          git push origin HEAD:integration/preview-runtime
